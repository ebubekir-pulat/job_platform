[project]
name = "job-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NAME", email = "something@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg>=3.3.5",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
job-platform = "job_platform:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
